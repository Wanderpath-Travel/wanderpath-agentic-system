# ==============================================================================
# Wanderpath Autonomous Agent Platform - Docker Compose Configuration
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # Service 1: Full-Stack Platform & Multi-Agent ASGI Server
  # ----------------------------------------------------------------------------
  wanderpath-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wanderpath-platform
    command: ["platform"]
    ports:
      - "8500:8500"
    environment:
      - PORT_PLATFORM=8500
      - PORT_MCP=8000
      - MCP_SERVER_URL=http://wanderpath-mcp:8000
      - DB_PATH=/app/db/wanderpath.sqlite3
      - CHROMA_PERSIST_DIR=/app/rag/chroma_db
      - WANDERPATH_ENV=production
      # Optional: Live LLM Provider API Keys
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-large-latest}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - wanderpath_db_data:/app/db
      - wanderpath_chroma_data:/app/rag/chroma_db
      - ./wanderpath_platform:/app/wanderpath_platform
      - ./mcp_server:/app/mcp_server
      - ./planning:/app/planning
      - ./rag:/app/rag
      - ./state_graph:/app/state_graph
      - ./agent:/app/agent
      - ./memory:/app/memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      wanderpath-mcp:
        condition: service_started
    networks:
      - wanderpath-net

  # ----------------------------------------------------------------------------
  # Service 2: Streamable HTTP / SSE Model Context Protocol (MCP) Server
  # ----------------------------------------------------------------------------
  wanderpath-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wanderpath-mcp
    command: ["mcp"]
    ports:
      - "8000:8000"
    environment:
      - PORT_MCP=8000
      - WANDERPATH_ENV=production
    volumes:
      - ./mcp_server:/app/mcp_server
      - ./planning:/app/planning
      - ./rag:/app/rag
      - ./state_graph:/app/state_graph
    restart: unless-stopped
    networks:
      - wanderpath-net

# ------------------------------------------------------------------------------
# Persistent Volume Mappings for Checkpoints & Vector Store
# ------------------------------------------------------------------------------
volumes:
  wanderpath_db_data:
    name: wanderpath_db_data
    driver: local
  wanderpath_chroma_data:
    name: wanderpath_chroma_data
    driver: local

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  wanderpath-net:
    name: wanderpath-net
    driver: bridge
